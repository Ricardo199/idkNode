<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baked Salmon Recipe</title>
</head>

<body>
    <div id="root"></div>

    <section id="ingredients">
        <h2>Ingredients</h2>
        <ul class="ingredients">
            <li>Salmon</li>
            <li>Butter</li>
            <li>Garlic</li>
            <li>Pepper</li>
            <li>Onion</li>
        </ul>
    </section>

    <section id="instructions">
        <h2>Instructions</h2>
        <ol class="instructions">
            <li>Preheat the oven to 350 degrees.</li>
            <li>Spread butter on the salmon.</li>
            <li>Season with garlic, pepper, and onion.</li>
            <li>Bake for 15 minutes.</li>
        </ol>
    </section>

    <!-- React library & ReactDOM (Development Version) -->
    <script src="https://unpkg.com/react@16.8.6/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@16.8.6/umd/react-dom.development.js"></script>
    <script>
        const dish = React.createElement('h1', { id: 'recipe-title' }, 'Baked Salmon');
        console.log(dish);
    </script>
</body>

</html>
